[platformio]
default_envs = reflectormic-s3-f32

[env]
platform = espressif32@6.7.0
board = m5stack-atom-voices3r
framework = arduino
extra_scripts = pre:scripts/web_assets.py, pre:scripts/speaker_build.py, pre:scripts/profile_build.py, post:scripts/rom_upload.py
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
board_build.flash_size = 8MB
board_build.filesystem = littlefs
board_build.partitions = partitions_reflectormic.csv
build_flags =
  -D ESP32S3
  -D CORE_DEBUG_LEVEL=3
  -mfix-esp32-psram-cache-issue
  -fstack-usage
  -D REFLECTORMIC_S3_TONE_F32=1
# Keep codec optimization flags scoped to lib/MbelibNeo/library.json.
# The pinned M5Unified revision avoids an I2S microphone startup deadlock
# with the Arduino-ESP32 version supplied by this platform.
lib_deps =
  M5Unified=https://github.com/m5stack/M5Unified.git#3b6bc50
  m5stack/M5GFX@0.2.27

[env:reflectormic-s3-f32]

# Disable detailed diagnostics while retaining echo and receive recovery.
[env:reflectormic-s3-f32-lean]
build_flags =
  ${env.build_flags}
  -D REFLECTORMIC_DIAGNOSTICS=0
